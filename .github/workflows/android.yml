# SPDX-License-Identifier: GPL-3.0-or-later
name: android-port

on:
  push:
    branches:
      - "port/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Android debug APK / ARMv7 + ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the port and its pinned SDL2 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Select JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build components
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277
      - name: Install the pinned SDK, NDK, and CMake versions
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;34.0.0"
          "cmake;3.22.1"
          "ndk;26.3.11579264"
      - name: Build the phone debug APK
        working-directory: ports/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload the debug-signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digs-v0.0.3-android-debug
          path: ports/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
