# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

# Publishes a tagged demo release.
#
# This replaces the v0.0.3-era release.yml, which ended in
# `gh release upload --clobber` against whatever release the tag named. That
# is a fine way to correct a release you are in the middle of cutting, and a
# very bad way to find out you have just overwritten the assets of a release
# that has been public for months.
#
# Three guards make that outcome unreachable rather than merely unlikely:
#
#   1. The tag must equal `v` plus the VERSION file at the tagged commit.
#      A tag naming a tree that does not agree with it is refused. Older tags
#      predate the VERSION file entirely, so this workflow cannot run against
#      them even if one is pushed again by accident.
#
#   2. A release that already carries assets is never modified on a tag push.
#      Replacing published assets requires a manual dispatch that names the
#      tag and types the confirmation, so it cannot happen as a side effect
#      of pushing anything.
#
#   3. The tagged commit must already be reachable from protected main. A
#      feature-branch tag is not release authority, even if its VERSION text
#      happens to agree with the tag name.
#
# The Win32 legacy addendum has its own workflow and is deliberately not
# invoked from here. It augments an existing release in place, which is
# exactly the operation this file exists to keep away from a tag push.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string
      replace_existing_assets:
        description: >-
          Type REPLACE to overwrite the assets of an already-published release.
          Leave empty for a normal publish.
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  # A corrected retag must supersede every earlier build for that exact tag;
  # otherwise an older runner could publish its stale artifacts afterwards.
  group: publish-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Confirm this tag may be published
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag being published
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          version=${DISPATCH_TAG:-$REF_NAME}
          case "$version" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *)
                  printf 'refusing to publish %s: not a vMAJOR.MINOR.PATCH tag\n' \
                      "$version" >&2
                  exit 1
                  ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Checkout the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 0
      - name: The tagged commit must already be on protected main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
              cat >&2 <<'EOF'
          Refusing to publish a tag whose commit is not reachable from main.

          A feature/review branch can carry a VERSION-consistent tag, but it
          has not passed the protected-main integration boundary required for
          a release. Merge it through reviewed main first, then create the
          release tag from that accepted history.
          EOF
              exit 1
          fi
          printf 'tagged commit is reachable from origin/main\n'
      - name: The tag must agree with the tree it names
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -Eeuo pipefail
          if [ ! -r VERSION ]; then
              cat >&2 <<'EOF'
          This commit has no VERSION file.

          That means it predates the single-source version, so it belongs to a
          release this workflow was never meant to publish. Publishing it here
          would build a bundle from one tree and label it with another tree's
          tag. Refusing.
          EOF
              exit 1
          fi
          tree_version="v$(tools/vox-version.sh)"
          if [ "$tree_version" != "$RELEASE_VERSION" ]; then
              printf 'tag %s names a tree whose VERSION is %s\n' \
                  "$RELEASE_VERSION" "$tree_version" >&2
              printf 'Fix VERSION and retag, or tag the right commit.\n' >&2
              exit 1
          fi
          printf 'tag and tree agree on %s\n' "$RELEASE_VERSION"
      - name: Every product surface must agree with VERSION
        run: tools/vox-version-check.sh
      - name: Refuse to overwrite a release that is already published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          CONFIRM: ${{ inputs.replace_existing_assets }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then
              printf 'no existing release for %s; this will create one\n' \
                  "$RELEASE_VERSION"
              exit 0
          fi
          assets=$(gh release view "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$assets" -eq 0 ]; then
              printf 'release %s exists but carries no assets; continuing\n' \
                  "$RELEASE_VERSION"
              exit 0
          fi
          if [ "$CONFIRM" = "REPLACE" ]; then
              printf 'replacing %d asset(s) on %s by explicit confirmation\n' \
                  "$assets" "$RELEASE_VERSION" >&2
              exit 0
          fi
          cat >&2 <<EOF
          Release $RELEASE_VERSION already has $assets published asset(s).

          Refusing to touch them. People have downloaded these, checksums have
          been published against them, and a tag push is not enough evidence
          that replacing them is what anybody wanted.

          If it genuinely is: run this workflow manually, give it the tag, and
          type REPLACE into replace_existing_assets.
          EOF
          exit 1

  linux-x86_64:
    name: Linux x86-64 release bundle
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.guard.outputs.version }}
      # The checked-in workbook is generated with CPython 3.12.3.  Pin the
      # same interpreter here as well as openpyxl so --check validates the
      # release source instead of comparing serializers from two CPython
      # generations.
      - name: Select the pinned QA workbook Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Install release build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsdl2-dev nasm python3-venv
      - name: Pin the QA workbook generator
        run: |
          python3 -m venv "$RUNNER_TEMP/vox-python"
          "$RUNNER_TEMP/vox-python/bin/python" -m pip install --disable-pip-version-check \
            'openpyxl==3.1.2' 'lxml==5.2.1'
          echo "$RUNNER_TEMP/vox-python/bin" >> "$GITHUB_PATH"
      # package-linux-demo.sh enforces the 10 MiB playable-payload ceiling
      # itself, so a bundle that outgrew the budget fails here rather than
      # being discovered by whoever downloads it.
      - name: Build and verify Linux release bundle
        env:
          VOX_PACKAGE_VERSION: ${{ needs.guard.outputs.version }}
          VOX_PACKAGE_GLIBC_MAX: '2.35'
          VOX_PACKAGE_BENCHMARK_FRAMES: '60'
          VOX_NAMED_BENCH_QUALIFY: '0'
        run: tools/package-linux-demo.sh
      - name: Upload Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux-x86_64
          path: |
            dist/vox-digs-${{ needs.guard.outputs.version }}-linux-x86_64.tar.gz
            dist/vox-digs-${{ needs.guard.outputs.version }}-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows-x86_64:
    name: Windows x86-64 release bundle
    needs: guard
    runs-on: windows-2022
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.guard.outputs.version }}
      - name: Build and verify Windows release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File
          .\tools\package-windows-demo.ps1 -Version $env:RELEASE_VERSION
      - name: Upload Windows release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-x86_64
          path: dist/vox-digs-${{ needs.guard.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [guard, linux-x86_64, windows-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.guard.outputs.version }}
          fetch-depth: 0
      - name: Confirm the tag still names this release commit
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -Eeuo pipefail
          local_commit=$(git rev-parse HEAD)
          remote_commit=$(git ls-remote origin "refs/tags/${RELEASE_VERSION}^{}" \
            | awk 'NR == 1 { print $1 }')
          test -n "$remote_commit"
          test "$local_commit" = "$remote_commit"
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Assemble checksums and release notes
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp -- {} dist/ \;
          test -f "dist/vox-digs-${RELEASE_VERSION}-linux-x86_64.tar.gz"
          test -f "dist/vox-digs-${RELEASE_VERSION}-windows-x86_64.zip"
          test -f "dist/vox-digs-${RELEASE_VERSION}-source.tar.gz"
          (
            cd dist
            sha256sum \
              "vox-digs-${RELEASE_VERSION}-linux-x86_64.tar.gz" \
              "vox-digs-${RELEASE_VERSION}-windows-x86_64.zip" \
              "vox-digs-${RELEASE_VERSION}-source.tar.gz" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          cat > release-notes.md <<EOF
          ## Downloads

          - **Windows x86-64:** download, extract, then double-click \`run-digs.bat\`.
          - **Linux x86-64:** download, extract, then run \`./run-digs.sh\`.

          Keep the extracted folder layout intact. Linux needs the SDL2 runtime
          from its distribution. \`SHA256SUMS\` verifies all release assets;
          the matching Corresponding Source archive is included for GPL-3.0-or-later compliance.
          EOF
      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -Eeuo pipefail
          # The guard job has already established that this is either a new
          # release, an empty one, or an explicitly confirmed replacement.
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/* --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "DIGS $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
