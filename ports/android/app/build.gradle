plugins {
    id "com.android.application"
}

def voxRoot = file("../../..").canonicalFile
def generatedVoxAssets = file("$buildDir/generated/vox-assets")

android {
    namespace "org.vox.digs"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.vox.digs"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "0.0.3-android-experimental"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "armeabi-v7a", "arm64-v8a"
                targets "digs_demo", "SDL2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDir(new File(voxRoot,
                    "third_party/SDL/android-project/app/src/main/java"))
            assets.srcDir(generatedVoxAssets)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.register("syncVoxAssets", Sync) {
    from(new File(voxRoot, "games/digs/scripts")) {
        into "share/digs/scripts"
    }
    from(new File(voxRoot, "games/digs/catalog")) {
        into "share/digs/catalog"
    }
    from(new File(voxRoot, "games/digs/icons")) {
        into "share/digs/icons"
    }
    from(new File(voxRoot,
            "third_party/SDL_GameControllerDB/gamecontrollerdb.txt")) {
        into "share/digs/controllers"
    }
    into generatedVoxAssets
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncVoxAssets"))
}
